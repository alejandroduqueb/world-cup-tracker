<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 – My Pool</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #07111f;
    color: #dde3f0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 60px;
  }

  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 0.08em;
    color: #fff;
  }
  header p { color: #4a6090; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }

  /* Controls */
  .controls {
    max-width: 960px;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .filters button, .toggle-btn {
    background: #111c30;
    border: 1px solid #1e2e4a;
    color: #6a82a8;
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filters button:hover, .filters button.active,
  .toggle-btn:hover, .toggle-btn.active {
    background: #163060;
    border-color: #2558aa;
    color: #fff;
  }

  .toggle-btn { background: #1a1200; border-color: #3a2800; color: #b08020; }
  .toggle-btn.active { background: #2a1e00; border-color: #c08030; color: #f0a030; }

  /* Stats bar */
  .stats {
    max-width: 960px;
    margin: 0 auto 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-box {
    background: #0e1a2e;
    border: 1px solid #1a2840;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.75rem;
    color: #4a6090;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-box strong { font-size: 1.1rem; color: #e0e8ff; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.06em; }

  /* Table */
  .table-wrap {
    max-width: 960px;
    margin: 0 auto;
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid #162030;
    box-shadow: 0 6px 30px rgba(0,0,0,0.6);
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; min-width: 600px; }

  thead tr { background: #0a1422; }
  thead th {
    padding: 10px 12px;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #3a5070;
    border-bottom: 1px solid #162030;
    white-space: nowrap;
  }
  thead th.center { text-align: center; }

  tbody tr {
    border-bottom: 1px solid #0e1825;
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #0d1b2e; }

  tbody tr.done {
    opacity: 0.45;
  }
  tbody tr.done td.team-home,
  tbody tr.done td.team-away { text-decoration: line-through; text-decoration-color: #3a5070; }

  /* Day separator */
  tr.day-sep td {
    background: #091420;
    padding: 5px 12px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #2a5090;
    border-top: 1px solid #142030;
  }

  td { padding: 10px 12px; vertical-align: middle; }

  td.date-col { color: #3a5070; font-size: 0.72rem; white-space: nowrap; }
  td.time-col { color: #2a6090; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  td.grp-col { text-align: center; color: #2a4a70; font-size: 0.72rem; font-weight: 700; }

  td.team-home { text-align: right; font-weight: 500; color: #c8d4e8; }
  td.team-away { text-align: left; font-weight: 500; color: #c8d4e8; }

  td.score-col { text-align: center; white-space: nowrap; }
  .score-box {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
  }
  .sn {
    background: #121e32;
    border: 1px solid #1e3050;
    border-radius: 4px;
    padding: 2px 8px;
    min-width: 26px;
    text-align: center;
    color: #e8f0ff;
  }
  .sd { color: #253a55; font-size: 0.75rem; }

  td.venue-col { color: #2e4060; font-size: 0.7rem; }

  /* Check column */
  td.check-col { text-align: center; }
  .check-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid #1e3050;
    border-radius: 4px;
    background: #0a1422;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    flex-shrink: 0;
  }
  input[type="checkbox"]:checked {
    background: #1a5030;
    border-color: #28a060;
  }
  input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 0px;
    width: 8px;
    height: 12px;
    border: 2px solid #40e090;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  /* Upcoming highlight */
  tr.next-up td { background: #0e1e10 !important; }
  tr.next-up td.team-home, tr.next-up td.team-away { color: #a8f0c0; }
  tr.next-up td.time-col { color: #40c070; }

  @media (max-width: 600px) {
    td, th { padding: 8px 8px; }
    td.venue-col { display: none; }
  }
</style>
</head>

<div class="stats" id="statsBar">

const STORAGE_KEY = 'wc2026_done';

function loadDone() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveDone(set) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
}

let done = loadDone();
let hideDone = false;
let activeFilter = 'all';

function getKey(dayIdx, mIdx) { return `${dayIdx}-${mIdx}`; }

function updateStats() {
  const total = DAYS.reduce((s, d) => s + d.matches.length, 0);
  document.getElementById('statDone').textContent = done.size;
  document.getElementById('statLeft').textContent = total - done.size;
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let firstUnchecked = true;

  DAYS.forEach((day, di) => {
    const visibleMatches = day.matches.filter((m, mi) => {
      if (activeFilter !== 'all' && m.g !== activeFilter) return false;
      const k = getKey(di, mi);
      if (hideDone && done.has(k)) return false;
      return true;
    });

    if (visibleMatches.length === 0) return;

    // Day separator
    const sep = document.createElement('tr');
    sep.className = 'day-sep';
    sep.innerHTML = `<td colspan="8">${day.label}</td>`;
    tbody.appendChild(sep);

    day.matches.forEach((m, mi) => {
      if (activeFilter !== 'all' && m.g !== activeFilter) return;
      const k = getKey(di, mi);
      const isDone = done.has(k);
      if (hideDone && isDone) return;

      const isNext = !isDone && firstUnchecked;
      if (isNext) firstUnchecked = false;

      const tr = document.createElement('tr');
      if (isDone) tr.classList.add('done');
      if (isNext) tr.classList.add('next-up');
      tr.setAttribute('data-key', k);

      tr.innerHTML = `
        <td class="check-col">
          <div class="check-wrap">
            <input type="checkbox" ${isDone ? 'checked' : ''} data-key="${k}" title="Mark as finished">
          </div>
        </td>
        <td class="date-col">${day.label.replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun),\s/, '')}</td>
        <td class="time-col">${m.time}</td>
        <td class="grp-col">${m.g}</td>
        <td class="team-home">${m.h}</td>
        <td class="score-col">
          <div class="score-box">
            <span class="sn">${m.hs}</span>
            <span class="sd">–</span>
            <span class="sn">${m.as}</span>
          </div>
        </td>
        <td class="team-away">${m.a}</td>
        <td class="venue-col">${m.venue}</td>
      `;
      tbody.appendChild(tr);
    });
  });

  // Attach checkbox listeners
  tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', e => {
      const k = e.target.dataset.key;
      if (e.target.checked) done.add(k); else done.delete(k);
      saveDone(done);
      updateStats();
      render();
    });
  });

  updateStats();
}

// Filter buttons
document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('button')) return;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.f;
  render();
});

// Hide done toggle
document.getElementById('hideDoneBtn').addEventListener('click', function() {
  hideDone = !hideDone;
  this.classList.toggle('active', hideDone);
  this.textContent = hideDone ? 'Show all' : 'Hide finished';
  render();
});

render();
